<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>The Radiant Heart - Messages Front</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: pointer;
            font-family: 'Arial', sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- TRÁI TIM --- */
        .heart-wrapper {
            position: relative;
            z-index: 5;
            /* Thấp hơn tin nhắn */
            width: 180px;
            height: 180px;
            filter: drop-shadow(0 0 20px rgba(255, 0, 80, 0.8));
            animation: heartBeat 1.5s infinite ease-in-out;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        svg {
            width: 100%;
            height: 100%;
            fill: url(#heartGradient);
        }

        @keyframes heartBeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
                filter: drop-shadow(0 0 40px rgba(255, 0, 80, 1));
            }
        }

        /* --- TIN NHẮN HIỆN PHÍA TRƯỚC --- */
        .message-bubble {
            position: absolute;
            padding: 12px 25px;
            border-radius: 30px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
            z-index: 100;
            /* Luôn hiện trên cùng */
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            background: linear-gradient(45deg, #8e2de2, #f00075);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fallAndFade 3.5s forwards ease-in;
        }

        @keyframes fallAndFade {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }

            15% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }

            30% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(var(--dx), 400px) scale(0.3) rotate(var(--dr));
                opacity: 0;
            }
        }

        .warp-active {
            animation: warpExplosion 0.8s forwards !important;
        }

        @keyframes warpExplosion {
            0% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(100);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <canvas id="warpCanvas"></canvas>

    <div class="heart-wrapper" id="heartBtn">
        <svg viewBox="0 0 32 32">
            <defs>
                <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff4d94;" />
                    <stop offset="100%" style="stop-color:#ff0040;" />
                </linearGradient>
            </defs>
            <path
                d="M16,28.261c0,0-14-7.926-14-17.046c0-9.356,13.159-10.399,14-0.454c0.841-9.945,14-8.902,14,0.454 C30,20.335,16,28.261,16,28.261z" />
        </svg>
    </div>

    <script>
        const messages = [
            "Ấn chậm thui nhé eiu ✨💖",
            "Chúng mình yêu nhau 100day rồi ✨💖",
            "Anh gởi tới em ngàn yêu thương ✨💖",
            "Mong tình iu luôn bền lâu 💫❤️",
            "Chúc em luôn cười thật tươi ✨💖",
            "100 ngày đặc biệt ✨💖",
            "Và còn hơn 100 ngày nữa ✨💖",
            "Mãi yêu em ✨💖",
            "Mong tình iu luôn bền lâu 💫❤️",
            "Cảm ơn em đã ở bên anh 🌹",
            "Bên em, anh thật hạnh phúc 🌹",
            "Yêu em nhiều hơn mỗi ngày 🥰",
            "Nắm lấy tay em thật chặt 🥰",
            "Bước tiếp những ngày tháng hạnh phúc 🥰",
            "Em đã sẵn sàng bước vào vũ trụ của chúng mình chưa? 🚀",
            "Hay là cứ thử ấn tiếp đi🥰",
            "Hình như là vẫn còn đó 🥰",
            "Sắp tới gòi, gáng lên 🥰",
            "Tới rùi đó 🥰"  
        ];

        let clickCount = 0;
        const maxClicks = messages.length;

        // --- BACKGROUND STARS ---
        const canvas = document.getElementById('warpCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, stars = [], speed = 0.5, isWarping = false;

        function init() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width; canvas.height = height;
            stars = [];
            for (let i = 0; i < 800; i++) {
                stars.push({ x: Math.random() * width - width / 2, y: Math.random() * height - height / 2, z: Math.random() * width });
            }
        }

        function animate() {
            ctx.fillStyle = isWarping ? "rgba(0,0,0,0.15)" : "black";
            ctx.fillRect(0, 0, width, height);
            for (let s of stars) {
                s.z -= speed;
                if (s.z <= 0) s.z = width;
                let x = (s.x / s.z) * width + width / 2;
                let y = (s.y / s.z) * height + height / 2;
                let radius = (1 - s.z / width) * 2;
                ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = isWarping ? "white" : "#444"; ctx.fill();
            }
            requestAnimationFrame(animate);
        }

        function createMessage(text) {
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerText = text;

            // Đặt ngay chính giữa màn hình (đè lên trái tim)
            bubble.style.left = "50%";
            bubble.style.top = "50%";

            // Biến ngẫu nhiên để rơi lệch
            const driftX = (Math.random() - 0.5) * 500;
            const randomRotation = (Math.random() - 0.5) * 90;

            bubble.style.setProperty('--dx', `${driftX}px`);
            bubble.style.setProperty('--dr', `${randomRotation}deg`);

            document.body.appendChild(bubble);
            setTimeout(() => bubble.remove(), 3500);
        }

        const heartBtn = document.getElementById('heartBtn');
        heartBtn.addEventListener('click', () => {
            if (isWarping) return;

            if (clickCount < maxClicks) {
                createMessage(messages[clickCount]);
                clickCount++;
                heartBtn.style.transform = `scale(${1 + clickCount * 0.12})`;
            } else {
                isWarping = true;
                heartBtn.classList.add('warp-active');
                const accelerate = setInterval(() => {
                    speed += 5;
                    if (speed > 180) {
                        clearInterval(accelerate);
                        window.location.href = "vutrutinhyeu.html";
                    }
                }, 20);
            }
        });

        window.addEventListener('resize', init);
        init(); animate();
    </script>
</body>

</html>
